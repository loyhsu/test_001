[project]
name = "expression-workshop-generator"
version = "0.1.0"
description = "Media generation service for Expression Workshop"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.27,<1",
  "imageio-ffmpeg>=0.6,<1",
  "numba>=0.62.1,<0.63; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "pillow>=11,<13",
  "pydantic>=2.12,<3",
  "rembg[cpu]>=2.0.67,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
